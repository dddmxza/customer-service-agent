<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能客服</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .chat-container {
    width: 480px;
    height: 640px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: #4a6cf7;
    color: #fff;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat-header button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #f9f9f9;
  }
  .msg {
    margin-bottom: 12px;
    display: flex;
  }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: #4a6cf7;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: #fff;
    color: #333;
    border: 1px solid #e5e5e5;
    border-bottom-left-radius: 4px;
  }
  .chat-input {
    display: flex;
    padding: 12px;
    border-top: 1px solid #eee;
    background: #fff;
  }
  .chat-input input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  .chat-input input:focus { border-color: #4a6cf7; }
  .chat-input button {
    margin-left: 8px;
    background: #4a6cf7;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .chat-input button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
  .typing { color: #999; font-size: 13px; font-style: italic; }
  .tool-status {
    color: #7a7a7a;
    font-size: 12px;
    font-style: italic;
    border-left: 2px solid #d0d0d0;
    padding-left: 8px;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <span>智能客服</span>
    <button onclick="resetChat()">重新开始</button>
  </div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <input id="input" type="text" placeholder="输入您的问题..." onkeydown="if(event.key==='Enter') send()">
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
  const API = "http://localhost:8000";
  let sessionId = "user_" + Math.random().toString(36).slice(2, 10);
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

   async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage("user", text);
    inputEl.value = "";
    sendBtn.disabled = true;

    // 助手气泡先建出来占位，后面往里填字
    const wrap = document.createElement("div");
    wrap.className = "msg assistant";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = "…";
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    let acc = "";          // 累积正文
    let toolBox = null;    // 当前工具状态行
    let done = false;      // 是否收到了 done 事件

    function setBubble(s) {
      bubble.textContent = s;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function dropToolBox() {
      if (toolBox) { toolBox.remove(); toolBox = null; }
    }

    try {
      const resp = await fetch(API + "/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });

      if (!resp.ok) throw new Error("HTTP " + resp.status);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";        // 未处理完的字节

      while (true) {
        const { done: streamDone, value } = await reader.read();
        if (streamDone) break;
        // stream: true 保证多字节 UTF-8 字符跨 chunk 时不会被切坏
        buf += decoder.decode(value, { stream: true });

        // SSE 以空行分帧。注意可能是 "\n\n"，也可能是 "\r\n\r\n"
        let idx;
        while ((idx = buf.search(/\r?\n\r?\n/)) >= 0) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx).replace(/^\r?\n\r?\n/, "");

          if (!frame.startsWith("data: ")) continue;
          let ev;
          try {
            ev = JSON.parse(frame.slice(6));
          } catch (e) {
            console.warn("坏帧，跳过：", frame);
            continue;
          }

          if (ev.type === "token") {
            acc += ev.text;
            setBubble(acc);
          } else if (ev.type === "tool_start") {
            dropToolBox();
            toolBox = document.createElement("div");
            toolBox.className = "msg assistant";
            const box = document.createElement("div");
            box.className = "tool-status";
            box.textContent = "正在查资料…";
            toolBox.appendChild(box);
            messagesEl.appendChild(toolBox);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } else if (ev.type === "tool_end") {
            if (toolBox) {
              toolBox.firstChild.textContent =
                "已查完（" + ev.ms + " ms）";
            }
          } else if (ev.type === "error") {
            dropToolBox();
            acc = acc || "抱歉，服务暂时不可用。";
            setBubble(acc);
          } else if (ev.type === "done") {
            done = true;
          }
        }
      }

      dropToolBox();
      if (!acc) setBubble("（无回复）");
    } catch (e) {
      dropToolBox();
      setBubble(acc || "网络错误，请稍后重试。");
    } finally {
      dropToolBox();
      if (!done && acc) {
        // 流断了但没收到 done：可以在这里做提示，本轮先不处理
      }
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function resetChat() {
    await fetch(API + "/reset/" + sessionId, { method: "POST" });
    messagesEl.innerHTML = "";
    addMessage("assistant", "您好，我是智能客服小X，有什么可以帮您？");
  }

  // 首次进入时的欢迎语
  addMessage("assistant", "您好，我是智能客服小X，有什么可以帮您？");
</script>

</body>
</html>
