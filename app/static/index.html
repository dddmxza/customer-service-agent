<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能客服</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .chat-container {
    width: 480px;
    height: 640px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: #4a6cf7;
    color: #fff;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat-header button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #f9f9f9;
  }
  .msg {
    margin-bottom: 12px;
    display: flex;
  }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: #4a6cf7;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: #fff;
    color: #333;
    border: 1px solid #e5e5e5;
    border-bottom-left-radius: 4px;
  }
  .chat-input {
    display: flex;
    padding: 12px;
    border-top: 1px solid #eee;
    background: #fff;
  }
  .chat-input input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  .chat-input input:focus { border-color: #4a6cf7; }
  .chat-input button {
    margin-left: 8px;
    background: #4a6cf7;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .chat-input button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
  .typing { color: #999; font-size: 13px; font-style: italic; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <span>智能客服</span>
    <button onclick="resetChat()">重新开始</button>
  </div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <input id="input" type="text" placeholder="输入您的问题..." onkeydown="if(event.key==='Enter') send()">
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
  const API = "http://localhost:8000";
  let sessionId = "user_" + Math.random().toString(36).slice(2, 10);
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage("user", text);
    inputEl.value = "";
    sendBtn.disabled = true;

    const typing = document.createElement("div");
    typing.className = "msg assistant";
    typing.innerHTML = '<div class="bubble typing">正在输入...</div>';
    messagesEl.appendChild(typing);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const resp = await fetch(API + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });
      const data = await resp.json();
      typing.remove();
      addMessage("assistant", data.reply);
    } catch (e) {
      typing.remove();
      addMessage("assistant", "网络错误，请稍后重试。");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function resetChat() {
    await fetch(API + "/reset/" + sessionId, { method: "POST" });
    messagesEl.innerHTML = "";
    addMessage("assistant", "您好，我是智能客服小X，有什么可以帮您？");
  }

  // 首次进入时的欢迎语
  addMessage("assistant", "您好，我是智能客服小X，有什么可以帮您？");
</script>

</body>
</html>
